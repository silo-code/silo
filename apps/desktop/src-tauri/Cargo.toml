[package]
name = "silo"
version = "0.33.0" # x-release-please-version
description = "Silo — a local-first, extensible code editor."
authors = ["Dave Weaver"]
license = "MIT"
repository = "https://github.com/silo-code/silo"
homepage = "https://github.com/silo-code/silo"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Dev-only automation RPC server (see src/commands/automation.rs). Compiled in
# by `npm run app:dev`; never enabled for release builds. Even when compiled it
# stays inert at runtime unless SILO_AUTOMATION=1.
automation = ["dep:tiny_http", "dep:xcap", "dep:base64"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "silo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tar = "0.4"
flate2 = "1"
# sha256 pin verification for registry installs (RFC 0014)
sha2 = "0.10"
# Content search backend for `ctx.search` — ripgrep's engine (matcher + searcher)
# and its `.gitignore`-aware directory walker.
grep = "0.3"
ignore = "0.4"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
dashmap = "5"
parking_lot = "0.12"
dirs = "5"
# Optional: only pulled in by the dev-only `automation` feature.
tiny_http = { version = "0.12", optional = true }
# Window capture for the dev-only `screenshot` automation op.
xcap = { version = "0.9", optional = true }
base64 = { version = "0.22", optional = true }

# Process resource metrics for ctx.processes.enableStats(). Used via
# sysinfo::System::refresh_processes_specifics — targeted (only known PIDs),
# so cost is proportional to the number of active terminal sessions, not total
# process count. enableStats({ trees: true }) upgrades to a full-table refresh
# (cpu+memory only, on a blocking worker) to build descendant trees. Defaults
# off: only polled when an extension calls enableStats().
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

# Self-owned PTY session host (RFC 0010). Unix-only (forkpty + Unix sockets);
# the app self-forks into its daemon via the hidden `--session-host` flag.
[target.'cfg(unix)'.dependencies]
pty-host = { path = "../../../crates/pty-host" }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

# macOS-only: Shift-state monitor. AppKit's NSEvent local monitor goes
# silent during an HTML5 drag (the webview's drag session captures the
# event flow), so we poll CoreGraphics' HID-level modifier state on a
# background thread instead. CG queries don't depend on event delivery.
# objc2: method-swizzle WKWebView to capture Finder drag-drop file paths
# (NSDraggingInfo.draggingPasteboard) — only accessible via the delegate.
# objc2-web-kit/app-kit/foundation/core-foundation + block2: webview_snapshot
# (Phase 1 of the ctx.webview bridge) — WKWebView.takeSnapshot(with:) to
# rect-capture the app's own webview (iframe pixels included) as PNG bytes.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
objc2 = "0.6"
block2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3", features = ["std", "NSData", "NSDictionary", "NSString", "NSObject"] }
objc2-app-kit = { version = "0.3", features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-web-kit = { version = "0.3", features = [
    "std",
    "WKWebView",
    "WKSnapshotConfiguration",
    "objc2-core-foundation",
    "objc2-app-kit",
    "block2",
] }

# Auto-updater + single-instance — desktop only (no mobile update channel; no
# second-launch model on mobile). Single-instance powers the `silo <path>` CLI:
# a second launch is forwarded to the running app (see commands/cli.rs).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

