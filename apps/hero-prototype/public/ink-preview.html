<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ink</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
        color: #e7e9ee;
        background: #121319;
      }
      nav {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 18px 28px;
        border-bottom: 1px solid #26283333;
      }
      .logo {
        font-weight: 800;
        font-size: 18px;
        letter-spacing: -0.02em;
        margin-right: auto;
      }
      nav a {
        color: #9a9daa;
        text-decoration: none;
        font-size: 14px;
      }
      .theme-toggle {
        border: 1px solid #33364066;
        background: #1b1d25;
        border-radius: 3px;
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        font-size: 13px;
        margin-left: 4px;
        color: #9a9daa;
        cursor: default;
      }
      main {
        max-width: 780px;
        margin: 0 auto;
        padding: 56px 28px 80px;
      }
      h1 {
        font-size: 44px;
        line-height: 1.1;
        margin: 0 0 16px;
        letter-spacing: -0.01em;
        color: #f5f6fa;
      }
      .lede {
        font-size: 16px;
        line-height: 1.6;
        color: #9a9daa;
        max-width: 480px;
        margin: 0 0 28px;
      }
      .cta-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 8px;
      }
      .cta {
        background: #f5f6fa;
        color: #121319;
        border: 0;
        border-radius: 6px;
        padding: 11px 20px;
        font-size: 14px;
        font-weight: 600;
      }
      .todo {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 11px;
        color: #f2c464;
        background: #3a2f1233;
        border: 1px dashed #6b532b;
        border-radius: 4px;
        padding: 3px 8px;
      }
      .hero-art {
        margin-top: 44px;
        height: 260px;
        border: 2px dashed #33364d;
        border-radius: 10px;
        display: grid;
        place-items: center;
        color: #5c5f6e;
        font-size: 13px;
        letter-spacing: 0.04em;
        background: repeating-linear-gradient(
          135deg,
          #16171f,
          #16171f 10px,
          #1a1c24 10px,
          #1a1c24 20px
        );
      }
      .row {
        display: flex;
        gap: 16px;
        margin-top: 40px;
      }
      .card {
        flex: 1;
        border: 1px solid #262833;
        border-radius: 8px;
        padding: 16px;
      }
      .card .bar {
        height: 8px;
        border-radius: 4px;
        background: #262833;
        margin-bottom: 8px;
      }
      .card .bar.short {
        width: 60%;
      }
    </style>
  </head>
  <body>
    <nav>
      <span class="logo">ink</span>
      <a href="#">Product</a>
      <a href="#">Docs</a>
      <a href="#">Pricing</a>
      <span class="theme-toggle" title="dark mode toggle — in progress">◐</span>
    </nav>
    <main>
      <h1>From idea to sketch<br />in seconds.</h1>
      <p class="lede">
        The zero-friction way to visualize your thoughts on macOS. Just open,
        draw, and share.
      </p>
      <div class="cta-row">
        <button class="cta">Download for Mac</button>
        <span class="todo">TODO: contrast pass — #214</span>
      </div>
      <div class="hero-art">hero mock — pending final art</div>
      <div class="row">
        <div class="card">
          <div class="bar short"></div>
          <div class="bar"></div>
          <div class="bar" style="width: 80%"></div>
        </div>
        <div class="card">
          <div class="bar short"></div>
          <div class="bar"></div>
          <div class="bar" style="width: 70%"></div>
        </div>
        <div class="card">
          <div class="bar short"></div>
          <div class="bar"></div>
          <div class="bar" style="width: 90%"></div>
        </div>
      </div>
    </main>
  </body>
</html>
