name: release

# Build + publish installers for every platform and generate the updater's
# latest.json. Triggered by pushing a `silo-v*` tag (e.g. `silo-v0.1.0`), or
# manually via the Actions tab.
on:
  workflow_dispatch:
  push:
    tags:
      - "silo-v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: "--target aarch64-apple-darwin"
          # Temporarily building only aarch64 Apple Silicon to limit CI minutes.
          # Re-enable these to restore full cross-platform releases.
          # - platform: macos-latest # Intel
          #   args: "--target x86_64-apple-darwin"
          # - platform: ubuntu-22.04
          #   args: ""
          # - platform: windows-latest
          #   args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup pnpm
        uses: pnpm/action-setup@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (minisign) — NOT Apple/Windows code signing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing + notarization (Developer ID). tauri-action signs
          # and notarizes when these are present; if the secrets are unset they
          # resolve to empty and the build is simply left unsigned. Only the
          # macOS legs consume them.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }} # base64 of the Developer ID Application .p12
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }} # .p12 export passphrase
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }} # "Developer ID Application: Name (TEAMID)"
          APPLE_ID: ${{ secrets.APPLE_ID }} # Apple account email (notarization)
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }} # app-specific password (notarization)
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }} # 10-char team id (notarization)
          # The frontend build (tsc + vite bundling Monaco/dockview/xterm) blows
          # past Node's default ~2GB heap; give it room so beforeBuildCommand
          # doesn't OOM. Inherited by the spawned `pnpm run build`.
          NODE_OPTIONS: --max-old-space-size=6144
        with:
          # The Tauri app lives in apps/desktop (monorepo); tauri-action runs the
          # build there and its beforeBuildCommand (pnpm run build) resolves the
          # workspace packages via the symlinks pnpm install created at the root.
          projectPath: apps/desktop
          tagName: silo-v__VERSION__
          releaseName: "Silo v__VERSION__"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
