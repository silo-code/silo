name: release-please

# Conventional-commit-driven versioning. On every push to main, release-please
# maintains a "release vX.Y.Z" PR (bumping versions + CHANGELOG from the commit
# history). Merging that PR tags `silo-vX.Y.Z` and creates the GitHub release.
#
# release-please pushes that tag with the default GITHUB_TOKEN, and tag pushes
# made by GITHUB_TOKEN do NOT trigger other workflows — so release.yml's
# `on: push: tags` would never fire on its own. We bridge it explicitly below
# with a workflow_dispatch, which IS allowed to run from GITHUB_TOKEN.
#
# The same GITHUB_TOKEN rule blocks the release PR itself: a PR opened with the
# default token does NOT fire `pull_request`, so ci.yml never runs on it and its
# required checks (frontend/rust/pr-title) stay absent — leaving the PR forever
# BLOCKED by branch protection. We mint a GitHub App installation token and hand
# it to release-please so the PR is authored by a non-GITHUB_TOKEN identity (the
# app's bot user), which lets `pull_request` fire and CI run on it normally.
#
# Setup (one-time): a GitHub App installed on this repo with Contents:write and
# Pull requests:write. Its App ID is stored as the `RELEASE_PLEASE_APP_ID` repo
# variable and its private key as the `RELEASE_PLEASE_APP_PRIVATE_KEY` secret.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write # allows dispatching release.yml below

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # When a release was just created, kick off the installer build. main HEAD
      # is the release commit (version already bumped), so release.yml reads the
      # correct version from tauri.conf.json.
      #
      # NOTE: this is a manifest config (config-file + manifest-file), so the
      # action exposes the aggregate `releases_created` (plural) — NOT the bare
      # `release_created`, which is only set in legacy single-package mode and is
      # always empty here (the per-path output is `apps/desktop--release_created`).
      - name: trigger installer build
        if: ${{ steps.release.outputs.releases_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref main -R ${{ github.repository }}
