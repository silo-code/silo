name: docs

# Build the VitePress docs site and publish it to GitHub Pages
# (https://silo-code.github.io/silo/). The site combines the hand-written
# guides with the API reference TypeDoc generates from the SDK's TSDoc, so
# `pnpm docs:build` runs `docs:api` before `vitepress build`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Re-parses the repo directly (not the deployed site), so this doesn't need
  # to wait on build/deploy — it just needs the push to have landed on main.
  context7-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Context7 refresh
        run: |
          curl -s -X POST https://context7.com/api/v1/refresh \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CONTEXT7_API_KEY }}" \
            -d '{"libraryName": "/silo-code/silo"}'
